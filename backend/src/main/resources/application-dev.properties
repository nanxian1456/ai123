# Local secrets live in backend/config/application-local.properties (ignored by Git).
# It is read from disk, outside src/main/resources, so it is never copied into target/ or the jar.
spring.config.import=optional:file:./config/application-local.properties,optional:file:./backend/config/application-local.properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:${user.home}/.ai-network-map/data;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
wechat.mini-program.app-id=${WECHAT_APP_ID:}
wechat.mini-program.app-secret=${WECHAT_APP_SECRET:}
auth.token-secret=${AUTH_TOKEN_SECRET:}
ai.extraction.api-key=${DEEPSEEK_API_KEY:}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://127.0.0.1:8080}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
