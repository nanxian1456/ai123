# Production credentials and public URLs must come from the deployment environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
wechat.mini-program.app-id=${WECHAT_APP_ID:}
wechat.mini-program.app-secret=${WECHAT_APP_SECRET:}
auth.token-secret=${AUTH_TOKEN_SECRET:}
ai.extraction.api-key=${DEEPSEEK_API_KEY:}
app.public-base-url=${APP_PUBLIC_BASE_URL:}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
# Behind Nginx or a cloud load balancer, use the client IP from X-Forwarded-For for rate limiting.
# Tomcat only trusts this header from private-network proxies by default; for a proxy on another
# address set SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (a regex of trusted proxy IPs).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
logging.file.name=${LOG_FILE:logs/ai-network.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=300MB
