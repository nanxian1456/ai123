# Production credentials and public URLs must come from the deployment environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
wechat.mini-program.app-id=${WECHAT_APP_ID:}
wechat.mini-program.app-secret=${WECHAT_APP_SECRET:}
auth.token-secret=${AUTH_TOKEN_SECRET:}
ai.extraction.api-key=${DEEPSEEK_API_KEY:}
ai.vision.api-key=${VISION_API_KEY:}
app.public-base-url=${APP_PUBLIC_BASE_URL:}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
logging.file.name=${LOG_FILE:logs/ai-network.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=300MB
