spring.application.name=ai-network-backend
spring.profiles.default=unconfigured
server.port=8080
spring.jackson.default-property-inclusion=non_null
spring.jpa.open-in-view=false
spring.cache.type=caffeine
spring.cache.cache-names=contactInsights,profiles
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m

auth.token-ttl-hours=${AUTH_TOKEN_TTL_HOURS:168}
avatar.storage-dir=${AVATAR_STORAGE_DIR:${user.home}/.ai-network-map/avatars}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.h2.console.enabled=false
spring.flyway.enabled=false

demo-data.enabled=${DEMO_DATA_ENABLED:false}
map.tencent.key=${TENCENT_MAP_KEY:}

ai.extraction.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
ai.extraction.model=${DEEPSEEK_MODEL:deepseek-flash}
ai.extraction.timeout-seconds=${DEEPSEEK_TIMEOUT_SECONDS:60}

api.rate-limit.default-per-minute=${API_RATE_LIMIT_DEFAULT:120}
api.rate-limit.write-per-minute=${API_RATE_LIMIT_WRITE:60}
api.rate-limit.ai-per-minute=${API_RATE_LIMIT_AI:10}
api.rate-limit.import-per-minute=${API_RATE_LIMIT_IMPORT:30}
api.ai-quota.account-per-day=${AI_ACCOUNT_DAILY_LIMIT:20}
api.ai-quota.global-per-day=${AI_GLOBAL_DAILY_LIMIT:200}
legacy.write-enabled=${LEGACY_WRITE_ENABLED:false}
wechat.mini-program.connect-timeout-seconds=${WECHAT_CONNECT_TIMEOUT_SECONDS:5}
wechat.mini-program.request-timeout-seconds=${WECHAT_REQUEST_TIMEOUT_SECONDS:10}

# Forwarded headers are ignored by default; enable only behind a trusted proxy that strips client headers.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

logging.pattern.level=%5p [requestId:%X{requestId:-none}]
logging.level.root=INFO
logging.level.com.aimap.backend=INFO
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
