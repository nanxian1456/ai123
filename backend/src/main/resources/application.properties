spring.application.name=ai-network-backend
server.port=8080
spring.jackson.default-property-inclusion=non_null
spring.config.import=optional:application-local.properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:${user.home}/.ai-network-map/data;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.cache.type=caffeine
spring.cache.cache-names=contactInsights,profiles
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m

# Production values must be supplied as environment variables. Do not commit them.
wechat.mini-program.app-id=${WECHAT_APP_ID:}
wechat.mini-program.app-secret=${WECHAT_APP_SECRET:}
auth.token-secret=${AUTH_TOKEN_SECRET:}
auth.token-ttl-hours=${AUTH_TOKEN_TTL_HOURS:168}
avatar.storage-dir=${AVATAR_STORAGE_DIR:${user.home}/.ai-network-map/avatars}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://127.0.0.1:8080}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.h2.console.enabled=false

# Supply the deployed web origins through CORS_ALLOWED_ORIGIN_PATTERNS. Native mini program requests do not require CORS.
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
demo-data.enabled=${DEMO_DATA_ENABLED:false}

# OpenAI-compatible contact extraction service. Keep API keys in environment variables.
ai.extraction.api-key=${AI_API_KEY:}
ai.extraction.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.extraction.model=${AI_MODEL:gpt-4o-mini}
ai.extraction.timeout-seconds=${AI_TIMEOUT_SECONDS:20}

api.rate-limit.default-per-minute=${API_RATE_LIMIT_DEFAULT:120}
api.rate-limit.write-per-minute=${API_RATE_LIMIT_WRITE:60}
api.rate-limit.ai-per-minute=${API_RATE_LIMIT_AI:10}
api.rate-limit.import-per-minute=${API_RATE_LIMIT_IMPORT:30}

logging.pattern.level=%5p [requestId:%X{requestId:-none}]
