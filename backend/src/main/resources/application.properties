spring.application.name=ai-network-backend
spring.profiles.default=dev
server.port=8080
spring.jackson.default-property-inclusion=non_null
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:${user.home}/.ai-network-map/data;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.cache.type=caffeine
spring.cache.cache-names=contactInsights,profiles
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m

auth.token-ttl-hours=${AUTH_TOKEN_TTL_HOURS:168}
avatar.storage-dir=${AVATAR_STORAGE_DIR:${user.home}/.ai-network-map/avatars}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.h2.console.enabled=false

demo-data.enabled=${DEMO_DATA_ENABLED:false}

ai.extraction.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
ai.extraction.model=${DEEPSEEK_MODEL:deepseek-flash}
ai.extraction.timeout-seconds=${DEEPSEEK_TIMEOUT_SECONDS:60}
ai.vision.base-url=${VISION_BASE_URL:}
ai.vision.model=${VISION_MODEL:}
ai.vision.timeout-seconds=${VISION_TIMEOUT_SECONDS:60}

api.rate-limit.default-per-minute=${API_RATE_LIMIT_DEFAULT:120}
api.rate-limit.write-per-minute=${API_RATE_LIMIT_WRITE:60}
api.rate-limit.ai-per-minute=${API_RATE_LIMIT_AI:10}
api.rate-limit.import-per-minute=${API_RATE_LIMIT_IMPORT:30}

logging.pattern.level=%5p [requestId:%X{requestId:-none}]
