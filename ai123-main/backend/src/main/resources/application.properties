spring.config.import=optional:classpath:application-local.properties

spring.application.name=ai-network-backend
server.port=8080
spring.jackson.default-property-inclusion=non_null

# WeChat Mini Program credentials are loaded from environment variables or application-local.properties.
# Do NOT put real secrets in this file. application-local.properties is gitignored.
wechat.mini-program.app-id=${WECHAT_APP_ID:}
wechat.mini-program.app-secret=${WECHAT_APP_SECRET:}
auth.token-secret=${AUTH_TOKEN_SECRET:local-development-secret-change-before-release}
auth.token-ttl-hours=${AUTH_TOKEN_TTL_HOURS:168}
